services:
  app:
    build: .
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY: "true"
      REDIS_URL: redis://redis:6379
      API_RATE_LIMIT_MAX: "3000"
      AUTH_RATE_LIMIT_MAX: "30"
      UPLOAD_RATE_LIMIT_MAX: "60"
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    # Docker Compose: start 4 app instances with `docker compose -f docker-compose.production.yml up -d --scale app=4`
    deploy:
      replicas: 4
    networks: [appnet]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    networks: [appnet]

networks:
  appnet:

volumes:
  redis_data:
