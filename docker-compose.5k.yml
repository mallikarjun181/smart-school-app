services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartschool
      POSTGRES_PASSWORD: smartschool
      POSTGRES_DB: smartschool
    volumes:
      - postgres_5k:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartschool -d smartschool"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [appnet]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_5k:/data]
    networks: [appnet]

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY: "true"
      DATABASE_URL: postgresql://smartschool:smartschool@postgres:5432/smartschool?schema=public&connection_limit=30&pool_timeout=20
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost
      APP_BASE_URL: http://localhost
      JWT_SECRET: "CHANGE_THIS_TO_A_RANDOM_SECRET_AT_LEAST_64_CHARACTERS"
      API_RATE_LIMIT_MAX: "3000"
      AUTH_RATE_LIMIT_MAX: "30"
      UPLOAD_RATE_LIMIT_MAX: "60"
      DATABASE_POOL_SIZE: "30"
      DATABASE_POOL_TIMEOUT: "20"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose: ["5000"]
    networks: [appnet]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [appnet]

networks:
  appnet:

volumes:
  postgres_5k:
  redis_5k:
