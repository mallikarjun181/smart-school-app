;padding:18px;z-index:20}.modal{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:92vh;overflow:auto}.modal-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-body{padding:20px}.close{width:36px;height:36px;border-radius:10px;background:#f1f3f6;font-size:23px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2f7;font-size:12px;font-weight:800}.status-present{color:#148047;background:#e5f7ec}.status-absent{color:#c8232b;background:#ffe7e8}.status-late{color:#ad6900;background:#fff0cf}.hw-grid{display:grid;gap:16px}.hw-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow)}.hw-top{display:flex;justify-content:space-between;gap:10px}.hw-subject{font-size:20px;font-weight:900}.hw-title{font-weight:800;margin-top:3px}.hw-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.hw-meta small{display:block;color:var(--muted);font-size:11px}.hw-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.att-options{display:flex;gap:7px;flex-wrap:wrap}.att-options button{border:1px solid var(--line);background:#fff;padding:7px 10px;border-radius:9px}.att-options .sel-p{background:#e5f7ec;color:#148047}.att-options .sel-a{background:#ffe7e8;color:#c8232b}.att-options .sel-l{background:#fff0cf;color:#ad6900}.profile-grid{display:grid;grid-template-columns:150px 1fr;gap:20px}.big-avatar{width:140px;height:140px;border-radius:24px;background:#fff0b0;display:grid;place-items:center;font-size:50px;overflow:hidden}.big-avatar img{width:100%;height:100%;object-fit:cover}.mobile-menu{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#202634;color:#fff;padding:12px 16px;border-radius:12px;z-index:50}.empty{text-align:center;padding:30px}.notice{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}.certificate{display:flex;gap:14px;align-items:center}.photo{width:80px;height:60px;object-fit:cover;border-radius:10px}.mini{font-size:12px}.footer-note{font-size:12px;color:var(--muted);margin-top:12px}@media(max-width:900px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:none}.main{margin-left:0}.mobile-menu{display:block}.stats,.modules,.two,.three{grid-template-columns:1fr}.hw-meta{grid-template-columns:1fr 1fr}.login-card{grid-template-columns:1fr}.brand{padding:25px}.login-form{padding:25px}.content{padding:15px}.top{padding:0 15px}.profile-grid{grid-template-columns:1fr}.big-avatar{margin:auto}.landing-hero{grid-template-columns:1fr}.landing-features{grid-template-columns:1fr}.landing-wrap{padding:30px 0}}

<script>
window.API_BASE = window.location.protocol === 'file:' ? 'http://localhost:5000/api' : '/api';
window.backendApiFetch = async function(path, options={}){
  const token=sessionStorage.getItem('smartSchoolToken');
  const headers={'Content-Type':'application/json',...(options.headers||{})};
  if(token) headers.Authorization='Bearer '+token;
  const r=await fetch(window.API_BASE+path,{...options,headers});
  let data={}; try{data=await r.json()}catch{}
  if(r.status===401 && token){sessionStorage.removeItem('smartSchoolToken');sessionStorage.removeItem('smartSchoolSession');}
  if(!r.ok) throw new Error(data.message||'Request failed');
  return data;
};
async function uploadSchoolFile(file,visibility='PUBLIC',studentId=''){
  if(!file) throw new Error('Please select a file first');
  const token=sessionStorage.getItem('smartSchoolToken'); const fd=new FormData();
  fd.append('file',file); fd.append('visibility',visibility); if(studentId) fd.append('studentId',String(studentId));
  const r=await fetch('/api/uploads',{method:'POST',headers:token?{Authorization:'Bearer '+token}:{},body:fd});
  let data={}; try{data=await r.json()}catch{}; if(!r.ok) throw new Error(data.message||'File upload failed'); return data.data||data;
}
function mapBackendStudent(s,localExtra={}){
  const cls=s.class||{};
  const className=cls.className?(String(cls.className)+'-'+String(cls.section||'A')):(s.className||localExtra.studentInfo?.className||'');
  const oldInfo=localExtra.studentInfo||{};
  const oldOther=localExtra.other||{};
  return {
    id:s.id, classId:s.classId||cls.id||localExtra.classId||'', name:s.name, roll:s.rollNumber||'',
    dob:s.dateOfBirth?String(s.dateOfBirth).slice(0,10):(localExtra.dob||''),
    gender:s.gender??localExtra.gender??'',
    parentName:s.parentName??s.parents?.[0]?.parent?.name??localExtra.parentName??'',
    parentMobile:s.parentMobile??localExtra.parentMobile??'',
    email:s.email??localExtra.email??'',
    house:s.house??localExtra.house??'',
    photo:s.photo??localExtra.photo??'',
    studentInfo:{studentId:s.studentId||oldInfo.studentId||'',schoolName:oldInfo.schoolName||schoolName||'Smart School',
      className:className||oldInfo.className||'',academicYear:s.academicYear||cls.academicYear||oldInfo.academicYear||'',
      status:s.status||oldInfo.status||'Active',studentType:oldInfo.studentType||'Day Scholar'},
    other:{villageTown:s.villageTown||oldOther.villageTown||'',district:s.district||oldOther.district||'',
      boardingPoint:s.boardingPoint||oldOther.boardingPoint||'',frequentDestination:s.frequentDestination||oldOther.frequentDestination||'',
      bus:s.bus||oldOther.bus||''}
  };
}
async function backendBootstrap(){
  try{
    const r=await apiFetch('/state');
    // IMPORTANT: keep a local snapshot of teacher data before importing the
    // legacy /state compatibility payload. The normalized /teachers endpoint
    // may not contain every legacy profile field (especially user.name), and
    // importing it blindly was causing names/details to disappear after refresh.
    const localTeacherHistory=load('teacherHistory',[]);
    const localTeachers=load('teachers',[]);
    const localTeacherCredentials=load('teacherCredentials',[]);
    if(r.success && r.data){
      Object.entries(r.data).forEach(([k,v])=>{
        if(['students','teachers','parents','classes','teacherCredentials'].includes(k)) return;
        if(k==='teacherHistory' && Array.isArray(v)){
          const serverIds=new Set(v.map(x=>String(x?.id)));
          const merged=[...v,...(Array.isArray(localTeacherHistory)?localTeacherHistory:[]).filter(x=>!serverIds.has(String(x?.id)))];
          localStorage.setItem('ss_'+k,JSON.stringify(merged));
          teacherHistory=merged;
        }else{
          localStorage.setItem('ss_'+k,JSON.stringify(v));
        }
      });
    }
    const savedStudents=load('students',[]);
    const savedByStudentId=new Map(savedStudents.map(x=>[String(x.studentInfo?.studentId||''),x]));
    const savedById=new Map(savedStudents.map(x=>[String(x.id),x]));
    const settings=await apiFetch('/settings');
    if(settings?.success && settings.data && Object.prototype.hasOwnProperty.call(settings.data,'paymentQr')){ schoolPaymentQR=settings.data.paymentQr||''; localStorage.setItem('ss_schoolPaymentQR',JSON.stringify(schoolPaymentQR)); }
    const me=await apiFetch('/auth/me');
    const u=me?.data||{};
    if(u.role==='PARENT'){
      const pm=await apiFetch('/parent/me');
      if(pm?.data){
        const p=pm.data.parent; const kids=pm.data.students||[];
        parents=[{id:p.id,userId:p.userId||u.id,name:p.name,mobile:p.mobile||u.mobile||'',email:p.email||u.email||'',username:p.user?.username||p.username||u.username||'',role:'PARENT'}];
        students=kids.map(st=>mapBackendStudent(st,savedById.get(String(st.id))||savedByStudentId.get(String(st.studentId||''))||{}));
        parentStudentMapping=kids.map(st=>({parentId:p.id,studentId:st.id,linkedBy:'backend',academicYear:st.academicYear||st.class?.academicYear||''}));
        localStorage.setItem('ss_parents',JSON.stringify(parents));
        localStorage.setItem('ss_students',JSON.stringify(students));
        localStorage.setItem('ss_parentStudentMapping',JSON.stringify(parentStudentMapping));
        const ar=await apiFetch('/attendance');
        if(ar?.success&&Array.isArray(ar.data)){
          attendance={};
          ar.data.forEach(a=>{const k=String(a.date).slice(0,10)+'_'+(a.period||'Attendance');(attendance[k] ||= {})[String(a.studentId)]=String(a.status||'PRESENT')==='PRESENT'?'Present':String(a.status||'')==='ABSENT'?'Absent':String(a.status||'')==='LATE'?'Late':String(a.status||'Present');});
          localStorage.setItem('ss_attendance',JSON.stringify(attendance));
        }
      }
    } else {
      const sr=await apiFetch('/students');
      if(sr?.success&&Array.isArray(sr.data)){
        const dbStudents=sr.data.map(st=>mapBackendStudent(st,savedById.get(String(st.id))||savedByStudentId.get(String(st.studentId||''))||{}));
        const dbKeys=new Set(dbStudents.map(x=>String(x.studentInfo?.studentId||x.id)));
        const localOnly=savedStudents.filter(x=>{const k=String(x.studentInfo?.studentId||x.id);return !dbKeys.has(k);});
        students=[...dbStudents,...localOnly];
        localStorage.setItem('ss_students',JSON.stringify(students));
      }
      const [tr,clr]=await Promise.all([apiFetch('/teachers'),apiFetch('/classes')]); if(tr?.success&&Array.isArray(tr.data)) {
        const classMap=new Map((clr?.data||[]).map(c=>[String(c.id),c]));
        // The legacy credentials/history records contain the full teacher name even
        // when the normalized /teachers response has user.name missing. Use them as
        // authoritative fallbacks so a refresh can NEVER blank the teacher name.
        const credByEmployee=new Map((Array.isArray(localTeacherCredentials)?localTeacherCredentials:[])
          .filter(c=>c.employeeId).map(c=>[String(c.employeeId).toLowerCase(),c]));
        const credById=new Map((Array.isArray(localTeacherCredentials)?localTeacherCredentials:[])
          .filter(c=>c.teacherId!=null).map(c=>[String(c.teacherId),c]));
        const historyRows=Array.isArray(localTeacherHistory)?localTeacherHistory:[];
        const historyByEmployee=new Map(historyRows.filter(h=>h.employeeId).map(h=>[String(h.employeeId).toLowerCase(),h]));
        const oldByKey=new Map((Array.isArray(localTeachers)?localTeachers:[]).map(t=>[String(t.userId||t.employeeId||t.id),t]));
        const oldByEmployee=new Map((Array.isArray(localTeachers)?localTeachers:[]).filter(t=>t.employeeId).map(t=>[String(t.employeeId).toLowerCase(),t]));
        teachers=tr.data.map(t=>{
          const old=oldByKey.get(String(t.userId||t.employeeId||t.id))||oldByEmployee.get(String(t.employeeId||'').toLowerCase())||{};
          const cred=credByEmployee.get(String(t.employeeId||'').toLowerCase())||credById.get(String(t.id||''))||{};
          const hist=historyByEmployee.get(String(t.employeeId||'').toLowerCase())||{};
          const ac=classMap.get(String(t.assignedClassId||''));
          return {
            ...old,
            id:t.id||old.id,
            userId:t.userId||old.userId,
            teacherName:t.user?.name||t.teacherName||old.teacherName||cred.teacherName||hist.teacherName||'',
            employeeId:t.employeeId||old.employeeId||cred.employeeId||hist.employeeId||'',
            mobile:t.mobile||t.user?.mobile||old.mobile||cred.mobile||hist.mobile||'',
            email:t.email||t.user?.email||old.email||cred.email||hist.email||'',
            gender:t.gender||old.gender||hist.gender||'',
            qualification:t.qualification||old.qualification||hist.qualification||'',
            department:t.department||old.department||hist.department||'',
            joiningDate:t.joiningDate||old.joiningDate||hist.joiningDate||'',
            teacherType:t.teacherType==='SUBJECT_TEACHER'?'Subject Teacher':(t.teacherType==='CLASS_TEACHER'?'Class Teacher':(t.teacherType||old.teacherType||cred.teacherType||hist.teacherType||'Class Teacher')),
            assignedClass:ac?((ac.className||'')+'-'+(ac.section||'')):(t.assignedClass||old.assignedClass||hist.assignedClass||''),
            assignedSubject:t.assignedSubject?.name||t.assignedSubject||old.assignedSubject||hist.assignedSubject||'',
            assignedClassId:t.assignedClassId||old.assignedClassId||'',
            assignedSubjectId:t.assignedSubjectId||old.assignedSubjectId||'',
            accountStatus:t.accountStatus||old.accountStatus||hist.accountStatus||'Allowed',
            role:t.teacherType==='SUBJECT_TEACHER'?'SUBJECT_TEACHER':(t.teacherType==='CLASS_TEACHER'?'CLASS_TEACHER':(t.role||old.role||cred.role||hist.role||'CLASS_TEACHER')),
            academicYear:ac?.academicYear||t.academicYear||old.academicYear||cred.academicYear||hist.academicYear||currentAcademicYear(),
            assignments:Array.isArray(t.assignments)&&t.assignments.length?t.assignments:(Array.isArray(old.assignments)?old.assignments:[])
          };
        });
        // Final repair pass: if any backend row still lacks a name, recover it from
        // credentials/history/local cache and persist the repaired teacher array.
        teachers=teachers.map(t=>{
          if(String(t.teacherName||'').trim()) return t;
          const c=credByEmployee.get(String(t.employeeId||'').toLowerCase())||credById.get(String(t.id||''));
          const h=historyByEmployee.get(String(t.employeeId||'').toLowerCase());
          const l=oldByEmployee.get(String(t.employeeId||'').toLowerCase());
          return {...t,teacherName:c?.teacherName||h?.teacherName||l?.teacherName||''};
        });
        // Keep legacy/local teacher records that the normalized endpoint does not return.
        const backendKeys=new Set(teachers.map(t=>String(t.userId||t.employeeId||t.id)));
        const localOnly=(Array.isArray(localTeachers)?localTeachers:[]).filter(t=>!backendKeys.has(String(t.userId||t.employeeId||t.id)));
        teachers=[...teachers,...localOnly];
        localStorage.setItem('ss_teachers',JSON.stringify(teachers));
      }
      // Credentials are a legacy UI record and must not be replaced by a partial
      // /state payload. Merge by teacherId/employeeId and preserve non-empty fields.
      if(Array.isArray(localTeacherCredentials)){
        const serverCreds=Array.isArray(r?.data?.teacherCredentials)?r.data.teacherCredentials:[];
        const byKey=new Map();
        [...serverCreds,...localTeacherCredentials].forEach(c=>{
          const key=String(c.teacherId||c.employeeId||c.email||c.mobile||'');
          const prev=byKey.get(key)||{};
          byKey.set(key,{...prev,...c,teacherName:c.teacherName||prev.teacherName||'',employeeId:c.employeeId||prev.employeeId||'',email:c.email||prev.email||'',mobile:c.mobile||prev.mobile||'',password:c.password||prev.password||'Temp@123'});
        });
        teacherCredentials=[...byKey.values()].filter(c=>teachers.some(t=>String(t.id)===String(c.teacherId)||String(t.employeeId||'').toLowerCase()===String(c.employeeId||'').toLowerCase()));
        localStorage.setItem('ss_teacherCredentials',JSON.stringify(teacherCredentials));
      }
      const pr=await apiFetch('/parents'); if(pr?.success&&Array.isArray(pr.data)) {parents=pr.data;localStorage.setItem('ss_parents',JSON.stringify(parents));}
    }
    const [cr,fr]=await Promise.all([apiFetch('/certificates'),apiFetch('/fees')]);
    if(cr?.success&&Array.isArray(cr.data)) {certificates=cr.data;localStorage.setItem('ss_certificates',JSON.stringify(certificates));}
    if(fr?.success&&Array.isArray(fr.data)) {fees=fr.data;localStorage.setItem('ss_fees',JSON.stringify(fees));}
    if(typeof render==='function') render();
  }catch(e){ console.warn('Backend bootstrap unavailable; using local demo cache.',e.message); }
}
async function backendSyncState(){
  try{
    const stateData={};
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);

function readPhoto(input){
  return new Promise(resolve=>{
    const file=input?.files?.[0];
    if(!file){resolve('');return;}
    if(!file.type.startsWith('image/')){toast('Please select an image file');resolve('');return;}
    if(file.size>5*1024*1024){toast('Profile photo must be 5 MB or smaller');resolve('');return;}
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result||'');
    reader.onerror=()=>{toast('Unable to read profile photo');resolve('');};
    reader.readAsDataURL(file);
  });
}

async function saveStudent(e,id){
  e.preventDefault();
  if(state.role!=='admin'&&state.role!=='owner'&&state.role!=='teacher')return toast('You are not allowed to manage students');
  const name=document.getElementById('stName').value.trim();
  const studentId=document.getElementById('stStudentId').value.trim();
  const parentMobile=document.getElementById('stParentMobile').value.trim();
   const parentName=document.getElementById('stParentName').value.trim();
  if(!name||!studentId||!parentMobile)return toast('Student name, Student ID and parent mobile are required');
  if(!/^[0-9+ ]{10,15}$/.test(parentMobile))return toast('Enter a valid parent mobile number');
  if(students.some(x=>String(x.studentInfo?.studentId||'').toLowerCase()===studentId.toLowerCase()&&String(x.id)!==String(id)))return toast('Student ID already exists');
  const photo=await readPhoto(document.getElementById('stPhoto'));
  const old=id!==null&&id!==undefined?students.find(x=>String(x.id)===String(id)):null;
  const className=document.getElementById('stClass').value;
  let classId=old?.classId||'';
  try{
    const cr=await apiFetch('/classes');
    const cc=(cr?.data||[]).find(c=>(String(c.className||'')+'-'+String(c.section||'')).toUpperCase()===String(className).toUpperCase());
    if(cc)classId=cc.id;
  }catch{}
  const rec={
    id:old?old.id:Date.now(),classId,name,roll:document.getElementById('stRoll').value.trim(),
    dob:document.getElementById('stDob').value,gender:document.getElementById('stGender').value,parentName,parentMobile,
    email:document.getElementById('stEmail').value.trim(),house:document.getElementById('stHouse').value.trim(),photo:photo||old?.photo||'',
    studentInfo:{studentId,schoolName:document.getElementById('stSchool').value.trim()||schoolName,className,
      academicYear:document.getElementById('stYear').value.trim(),status:document.getElementById('stStatus').value,
      studentType:document.getElementById('stStudentType').value},
    other:{villageTown:document.getElementById('stVillage').value.trim(),district:document.getElementById('stDistrict').value.trim(),
      boardingPoint:document.getElementById('stBoarding').value.trim(),frequentDestination:document.getElementById('stDestination').value.trim(),bus:document.getElementById('stBus').value.trim()}
  };
  try{
    let backendStudent=null;
    const payload={studentId:rec.studentInfo.studentId,name:rec.name,rollNumber:rec.roll||null,dateOfBirth:rec.dob?new Date(rec.dob).toISOString():null,gender:rec.gender||null,email:rec.email||null,parentName:parentName||null,parentMobile:rec.parentMobile||null,house:rec.house||null,classId:rec.classId||null,academicYear:rec.studentInfo.academicYear||null,status:rec.studentInfo.status||'Active',photo:rec.photo||null};
    if(old && String(old.id).length>10){
      const r=await apiFetch('/students/'+encodeURIComponent(String(old.id)),{method:'PUT',body:JSON.stringify(payload)});
      backendStudent=r?.data||r;
    }else{
      const r=await apiFetch('/students',{method:'POST',body:JSON.stringify(payload)});
      backendStudent=r?.data||r;
    }
    if(!backendStudent?.id) throw new Error('The server did not return the saved student record');
    rec.id=backendStudent.id;
    // Verify the values that users reported disappearing after refresh. Do not
    // pretend a local save succeeded when the database did not store them.
    const vr=await apiFetch('/students/'+encodeURIComponent(String(rec.id)));
    const saved=vr?.data||vr;
    const same=(a,b)=>String(a??'').trim()===String(b??'').trim();
    const mismatches=[];
    if(!same(saved.gender,rec.gender))mismatches.push('gender');
    if(!same(saved.email,rec.email))mismatches.push('email');
    if(!same(saved.parentName,rec.parentName))mismatches.push('parent name');
    if(!same(saved.house,rec.house))mismatches.push('house');
    if(!same(saved.parentMobile,rec.parentMobile))mismatches.push('parent mobile');
    if(mismatches.length) throw new Error('Database did not persist: '+mismatches.join(', '));
  }catch(err){
    console.error('Student database write/verification failed:',err);
    return toast('Student was NOT saved: '+String(err?.message||'Database error'));
  }
  if(old)students=students.map(x=>String(x.id)===String(id)?rec:x);else students.unshift(rec);
  save('students',students);
  try{if(window.backendSyncState) await window.backendSyncState();}catch(err){console.warn('Student state sync retry:',err.message)}
  closeModal();render();
  toast(old?'Student updated successfully':'Student added successfully');
}

async function submitParentPasswordReset(e,parentId){
  e.preventDefault();
  const a=document.getElementById('prNew')?.value||'',b=document.getElementById('prConfirm')?.value||'',btn=document.getElementById('prSave');
  if(a.length<10)return toast('Password must be at least 10 characters');

  if(a!==b)return toast('Passwords do not match');
  if(btn){btn.disabled=true;btn.textContent='Resetting…'}
  try{
    const r=await apiFetch('/parents/'+encodeURIComponent(parentId)+'/reset-password',{method:'POST',body:JSON.stringify({newPassword:a,confirmPassword:b})});
    const p=parents.find(x=>String(x.id)===String(parentId));
    if(p){p.mustChangePassword=true;p.password=a;p.passwordUpdatedAt=new Date().toISOString();}
    const existing=parentCredentialStatus[String(parentId)]||{};
    parentCredentialStatus[String(parentId)]={...existing,parentId:String(parentId),username:p?.username||existing.username||'',mustChangePassword:true,passwordUpdatedAt:new Date().toISOString(),resetBy:state.identity||state.user?.email||'CLASS_TEACHER'};
    const c=parentCredentials.find(x=>String(x.parentId)===String(parentId));
    if(c){c.password=a;c.lastUpdated=Date.now();c.passwordStatus='Temporary / Reset by Class Teacher'}
    else if(p){parentCredentials.push({parentId:p.id,userId:p.userId,name:p.name,username:p.username||'',email:p.email||'',mobile:p.mobile||'',password:a,academicYear:p.academicYear||currentAcademicYear(),lastUpdated:Date.now()})}
    save('parents',parents);save('parentCredentials',parentCredentials);save('parentCredentialStatus',parentCredentialStatus);
    closeModal();render();
    setTimeout(()=>showParentCredentials(p,students.find(x=>String(x.id)===String(parentStudentMapping.find(m=>String(m.parentId)===String(parentId))?.studentId)),a),100);
    toast(r?.data?.message||'Parent password reset successfully');
  }catch(err){if(btn){btn.disabled=false;btn.textContent='🔑 Reset Parent Password'}toast(err.message||'Unable to reset parent password')}
}

  teacherHistory.unshift(row);
  localStorage.setItem('ss_teacherHistory',JSON.stringify(teacherHistory));

  return await persistTeacherHistoryNow();
}
async function deleteTeacherHistory(id){
  if(!isAdminRole())return toast('Only App Owner or Admin can delete teacher history');
  const idx=teacherHistory.findIndex(h=>String(h.id)===String(id));
  if(idx<0)return toast('Teacher history record not found');
  const record=teacherHistory[idx];
  if(!confirm('Delete this teacher history record for '+String(record.teacherName||'this teacher')+'? This cannot be undone.'))return;
  teacherHistory.splice(idx,1);
  localStorage.setItem('ss_teacherHistory',JSON.stringify(teacherHistory));
  localStorage.setItem('ss_teacherHistoryArchive',JSON.stringify(teacherHistory));
  const ok=await persistTeacherHistoryNow();
  if(!ok)return toast('History deleted locally, but server sync failed. Please try again while online.');
  render();
  toast('Teacher history record deleted successfully');
}

function parentAttendancePage(){
  const p=currentParent();
  const linked=parentChildIds();
  const child=students.find(s=>linked.includes(String(s.id))) || students.find(s=>linked.includes(s.id));
  if(!child)return '<div class="card empty"><h2>No Child Linked</h2><p class="muted">No student is linked to this parent account.</p></div>';

  let records=[];
  Object.entries(attendance||{}).forEach(([key,rec])=>{
    if(!rec)return;
    const raw=rec[String(child.id)]??rec[child.id];
    if(raw===undefined)return;
    const parts=key.split('_'),date=parts[0],period=parts.slice(1).join('_')||'Attendance';
    records.push({date,period,status:String(raw)});
  });
  records.sort((a,b)=>b.date.localeCompare(a.date)||a.period.localeCompare(b.period));
  const present=records.filter(r=>r.status==='Present').length,total=records.length,absent=records.filter(r=>r.status==='Absent').length,late=records.filter(r=>r.status==='Late').length;
  const pct=total?((present/total)*100).toFixed(1):'0.0';
  return '<div class="head"><div><h1>My Child&#39;s Attendance</h1><p class="muted">Only '+esc(child.name)+' • Class '+esc(childClass)+'</p></div><span class="pill">Parent View • Read Only</span></div>'+  '<div class="grid stats"><div class="card stat"><div><small>Attendance Percentage</small><strong>'+pct+'%</strong></div><div class="stat-icon green">%</div></div><div class="card stat"><div><small>Present</small><strong>'+present+'</strong></div><div class="stat-icon green">✓</div></div><div class="card stat"><div><small>Absent</small><strong>'+absent+'</strong></div><div class="stat-icon red">✕</div></div><div class="card stat"><div><small>Late</small><strong>'+late+'</strong></div><div class="stat-icon orange">◷</div></div></div>'+  '<div class="card"><div class="head"><div><h2 style="margin:0">'+esc(child.name)+' — Attendance Record</h2><p class="muted">'+(total?('Present '+present+' • Absent '+absent+' • Late '+late):'No saved attendance records yet.')+'</p></div><span class="sheet-percent">'+pct+'%</span></div><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Date</th><th>Session</th><th>Status</th></tr></thead><tbody>'+  (records.length?records.map(r=>'<tr><td>'+esc(r.date)+'</td><td>'+esc(r.period)+'</td><td><span class="pill '+(r.status==='Present'?'status-present':r.status==='Absent'?'status-absent':'status-late')+'">'+esc(r.status)+'</span></td></tr>').join(''):'<tr><td colspan="3" class="empty">No attendance has been saved for this child yet.</td></tr>')+  '</tbody></table></div></div>';

function attRec(){let k=state.attDate+'_'+state.attPeriod;attendance[k]=attendance[k]||{};return attendance[k]} function setAtt(id,v){let rec=attRec();rec[String(id)]=v;save('attendance',attendance);render()} function markAll(v){let list=students.filter(s=>(s.studentInfo?.className||s.className||s.class||'')===teacherProfile.className);let rec=attRec();list.forEach(s=>{rec[String(s.id)]=v});attendance[state.attDate+'_'+state.attPeriod]=rec;save('attendance',attendance);render();toast(v==='Present'?'All students marked Present':'All students marked '+v)} function clearAtt(){delete attendance[state.attDate+'_'+state.attPeriod];save('attendance',attendance);render()} async function sendAbsentParentMessages(list,rec){let absent=list.filter(s=>(rec[String(s.id)]||rec[s.id]||'Present')==='Absent').filter(s=>String(s.parentMobile||'').trim());let pending=absent.filter(s=>!parentNotifications.some(n=>n.key===state.attDate+'_'+state.attPeriod+'_'+s.id));if(!pending.length)return {sent:0,failed:0,mode:'none'};let payload=pending.map(s=>({studentId:s.id,studentName:s.name,parentMobile:String(s.parentMobile).trim(),className:teacherProfile.className,date:state.attDate,period:state.attPeriod,message:'Dear Parent, your child '+s.name+' was marked ABSENT from school on '+state.attDate+' for '+state.attPeriod+'. Please contact the school if required.'}));try{let res=await apiFetch('/api/send-absent-sms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:payload})});let data=await res.json();if(!res.ok)throw new Error(data.error||'SMS service unavailable');let sentItems=Array.isArray(data.sent)?data.sent:[];sentItems.forEach(item=>{parentNotifications.unshift({id:Date.now()+Math.random(),key:state.attDate+'_'+state.attPeriod+'_'+item.studentId,studentId:item.studentId,studentName:item.studentName,parentMobile:item.parentMobile,className:teacherProfile.className,date:state.attDate,period:state.attPeriod,message:item.message,sentAt:new Date().toISOString(),status:'Sent',providerMessageId:item.providerMessageId||''})});let failed=Array.isArray(data.failed)?data.failed:[];failed.forEach(item=>{parentNotifications.unshift({id:Date.now()+Math.random(),key:state.attDate+'_'+state.attPeriod+'_'+item.studentId,studentId:item.studentId,studentName:item.studentName,parentMobile:item.parentMobile,className:teacherProfile.className,date:state.attDate,period:state.attPeriod,message:item.message,sentAt:new Date().toISOString(),status:'Failed',error:item.error||'SMS failed'})});save('parentNotifications',parentNotifications);return {sent:sentItems.length,failed:failed.length,mode:'sms'}}catch(err){console.error(err);return {sent:0,failed:pending.length,mode:'unavailable',error:err.message}}} async function saveAttendance(){
  let k=state.attDate+'_'+state.attPeriod,rec=attendance[k]||{};
  let selectedClass=activeClassForTeacher()||teacherProfile.className||'';
  let list=students.filter(s=>(s.studentInfo?.className||s.className||s.class||'')===selectedClass);
  let snapshot={id:k+'_'+selectedClass,className:selectedClass,date:state.attDate,period:state.attPeriod,records:list.map(s=>({studentId:s.id,roll:s.roll,name:s.name,status:rec[String(s.id)]||rec[s.id]||'Present'}))};
  attendanceHistory=attendanceHistory.filter(h=>h.id!==snapshot.id);attendanceHistory.push(snapshot);save('attendance',attendance);save('attendanceHistory',attendanceHistory);
  let backendSaved=false;
  try{
    const response=await apiFetch('/attendance/bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:state.attDate,period:state.attPeriod,records:snapshot.records.map(r=>({studentId:String(r.studentId),status:r.status}))})});
    const data=await response.json();
    if(!response.ok||data?.success===false)throw new Error(data?.message||'Unable to save attendance to server');
    backendSaved=true;
    const fresh=await apiFetch('/attendance');
    if(fresh?.success&&Array.isArray(fresh.data)){
      attendance={};
      fresh.data.forEach(a=>{const key=String(a.date).slice(0,10)+'_'+(a.period||'Attendance');(attendance[key] ||= {})[String(a.studentId)]=a.status==='PRESENT'?'Present':a.status==='ABSENT'?'Absent':a.status==='LATE'?'Late':String(a.status||'Present');});
      save('attendance',attendance);
    }
  }catch(err){console.warn('Backend attendance sync failed:',err.message)}
  let result=await sendAbsentParentMessages(list,rec);
  if(result.mode==='sms')toast(result.failed ? 'Attendance saved, but some SMS messages failed.' : 'Attendance saved and SMS sent successfully');
  else if(!backendSaved)toast('Attendance saved locally, but server sync is unavailable.');
  else if(result.mode==='unavailable')toast('Attendance saved successfully. SMS service is not connected.');
  else toast('Attendance saved successfully.');
}

function saveEditedAttendanceHistory(e,id){
  e.preventDefault();let h=attendanceHistory.find(x=>String(x.id)===String(id)&&x.className===teacherProfile.className);if(!h)return;
  let oldKey=h.date+'_'+h.period,newDate=document.getElementById('ehdate').value,newPeriod=document.getElementById('ehperiod').value,newId=newDate+'_'+newPeriod+'_'+teacherProfile.className;
  if(attendanceHistory.some(x=>String(x.id)===String(newId)&&String(x.id)!==String(id)))return toast('History already exists for this date and session');
  h.date=newDate;h.period=newPeriod;h.id=newId;
  (h.records||[]).forEach((r,i)=>{let sel=document.getElementById('ehs_'+i);if(sel)r.status=sel.value});
  let rec={};(h.records||[]).forEach(r=>rec[String(r.studentId)]=r.status);delete attendance[oldKey];attendance[newDate+'_'+newPeriod]=rec;
  save('attendance',attendance);save('attendanceHistory',attendanceHistory);closeModal();toast('Attendance history updated');render();

function deleteAttendanceHistory(id){
  try{
    if(state.role!=='teacher') return toast('Only Class Teacher can delete attendance history');
    const h=attendanceHistory.find(x=>String(x.id)===String(id)&&x.className===teacherProfile.className);
    if(!h) return toast('Attendance history not found');
    if(!window.confirm('Delete attendance history for '+h.date+' • '+h.period+'?')) return;
    attendanceHistory=attendanceHistory.filter(x=>String(x.id)!==String(id));
    delete attendance[h.date+'_'+h.period];
    save('attendanceHistory',attendanceHistory);save('attendance',attendance);
    toast('Attendance history deleted successfully');render();
  }catch(err){console.error(err);toast('Unable to delete attendance history.');}
}
function clearAttendanceHistory(){
  try{
    if(state.role!=='teacher') return toast('Only Class Teacher can clear attendance history');
    const cls=teacherProfile.className||'';
    const classHistory=attendanceHistory.filter(h=>h&&h.className===cls);
    if(!classHistory.length) return toast('No attendance history to clear');
    if(!window.confirm('Clear ALL '+classHistory.length+' attendance session(s) for Class '+cls+'? This cannot be undone.')) return;
    const keys=new Set(classHistory.map(h=>h.date+'_'+h.period));
    attendanceHistory=attendanceHistory.filter(h=>!h||h.className!==cls);
    keys.forEach(k=>delete attendance[k]);
    save('attendanceHistory',attendanceHistory);save('attendance',attendance);
    state.attHistoryDate='';toast('All attendance history cleared for Class '+cls);render();
  }catch(err){console.error(err);toast('Unable to clear attendance history.');}
}

function downloadAttendanceExcel(){
  try{
    if(state.role!=='teacher') return toast('Only Class Teacher can download attendance history');
    const cls=teacherProfile.className||'Class';
    const filterDate=state.attHistoryDate||'';
    const histories=attendanceHistory.filter(h=>h&&h.className===cls&&(!filterDate||h.date===filterDate)).sort((a,b)=>(String(b.date)+String(b.period)).localeCompare(String(a.date)+String(a.period)));
    if(!histories.length) return toast('No attendance history to download');
    const rows=[];
    histories.forEach(h=>(h.records||[]).forEach(r=>rows.push([h.date,h.period,r.roll,r.name,cls,r.status])));
    if(!rows.length) return toast('No student attendance records to download');
    const csvRows=[['Date','Session','Roll No.','Student Name','Class','Status'],...rows];
    const csv='\uFEFF'+csvRows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='Attendance_History_'+cls.replace(/[^a-z0-9]+/gi,'_')+(filterDate?'_'+filterDate:'')+'.csv';
    a.target='_blank';a.rel='noopener';a.style.display='none';
    document.body.appendChild(a);
    a.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:window}));
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},5000);
    toast('Attendance Excel file downloaded');
  }catch(err){console.error(err);toast('Unable to download Excel. Please try again.');}
}

async function saveFee(e){
  e.preventDefault();
  const due=document.getElementById('feeDue').value;
  const selectedId=document.getElementById('feeStudent').value;
  try{
    // Resolve the browser's selected record to the real PostgreSQL student ID before the tenant check.
    const sr=await apiFetch('/students');
    const backendStudents=sr?.data||[];
    const local=students.find(s=>String(s.id)===String(selectedId));
    const real=backendStudents.find(s=>String(s.id)===String(selectedId))||backendStudents.find(s=>String(s.studentId||'')===String(local?.studentInfo?.studentId||''))||backendStudents.find(s=>String(s.name||'').trim().toLowerCase()===String(local?.name||'').trim().toLowerCase());
    if(!real?.id)return toast('Selected student could not be matched to the school database. Refresh and try again.');
    const body={studentId:String(real.id),feeType:document.getElementById('feeType').value.trim(),amount:Number(document.getElementById('feeAmount').value),academicYear:document.getElementById('feeYear').value.trim(),dueDate:due?new Date(due).toISOString():null,status:document.getElementById('feeStatus').value,paymentStatus:document.getElementById('feePayment').value,receiptNumber:document.getElementById('feeReceipt').value.trim()||null};
    const qr=document.getElementById('feeQrFile')?.files?.[0];
    if(qr){if(!/^image\/(png|jpeg|webp)$/.test(qr.type))return toast('Fee QR must be PNG, JPG or WEBP');if(qr.size>5*1024*1024)return toast('Fee QR must be 5 MB or smaller');const up=await uploadSchoolFile(qr,'PUBLIC');body.paymentQr=up.url}
    const r=await apiFetch('/fees',{method:'POST',body:JSON.stringify(body)});fees=[r.data,...fees];save('fees',fees);closeModal();render();toast('Fee update saved successfully');
  }catch(err){toast(err.message||'Unable to save fee update')}
}

function saveClassTeacherMarksSheet(){

  });

async function saveEvent(e){
  e.preventDefault();
  if(!(isAdminRole()||state.role==='teacher'))return toast('Only Admin or Class Teacher can add events');
  const title=document.getElementById('evTitle')?.value.trim(); if(!title)return toast('Enter event title');
  const photos=[...(document.getElementById('evPhotos')?.files||[])],videos=[...(document.getElementById('evVideos')?.files||[])];
  if(photos.some(f=>f.size>5*1024*1024))return toast('Each photo must be 5 MB or smaller');
  if(videos.some(f=>f.size>25*1024*1024))return toast('Each video must be 25 MB or smaller');
  if(photos.length>12)return toast('You can upload up to 12 photos');
  if(videos.length>5)return toast('You can upload up to 5 videos');
  try{
    const [photoData,videoData]=await Promise.all([readEventFiles(photos,5*1024*1024),readEventFiles(videos,25*1024*1024)]);
    const audience=document.getElementById('evAudience').value;
    const targetClass=document.getElementById('evClass')?.value||'';
    events.unshift({id:Date.now(),title,date:document.getElementById('evDate').value,place:document.getElementById('evPlace').value.trim(),description:document.getElementById('evDesc').value.trim(),essentials:document.getElementById('evEssentials').value.trim(),audience,targetClass,targetClassList:audience==='All Created Classes'?classes.map(c=>(c.className||'')+'-'+(c.section||'')):[],photos:photoData,videos:videoData,createdBy:state.identity||state.role,createdAt:new Date().toISOString()});
    save('events',events);closeModal();render();toast('✓ Event, photos and videos published');
  }catch(err){toast(err.message||'Unable to save event')}
}

async function restoreAuthenticatedSession(){
 try{
   const token=sessionStorage.getItem('smartSchoolToken');
   if(!token){welcomeScreen();return}
   const r=await apiFetch('/auth/me');
   const user=r?.data;
   const normalizedRole=roleKey(user?.role);
   if(!r?.success || !user?.id || !normalizedRole) throw new Error('Invalid session');
   state.user=user; state.role=normalizedRole; state.identity=user.username||user.email||user.mobile||''; state.page='dashboard'; state.loginError='';
   sessionStorage.setItem('smartSchoolSession',JSON.stringify({role:normalizedRole,userId:user.id,name:user.name||'',email:user.email||'',mobile:user.mobile||'',status:user.status||'ACTIVE'}));
   if(user.mustChangePassword) mandatoryPasswordChange('backend_'+user.id); else render();
 }catch(e){
   sessionStorage.removeItem('smartSchoolToken');
   sessionStorage.removeItem('smartSchoolSession');
   state.user=null; state.role=null; welcomeScreen();
 }
}

/* ===== Secure private-file viewer/download fix =====
   Private files are served from /api/files/:id and require the current Bearer token.
   Normal href/src navigation cannot attach that header, so all private-file UI actions
   use fetch() with the authenticated token and a temporary Blob URL instead. */
function ssIsPrivateFile(src){return String(src||'').startsWith('/api/files/');}
async function ssOpenFile(src,download,filename){
  src=String(src||''); if(!src)return toast('File not available');
  if(!ssIsPrivateFile(src)){
    if(download){const a=document.createElement('a');a.href=src;a.download=filename||'file';a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();}
    else window.open(src,'_blank','noopener');
    return;
  }
  const token=sessionStorage.getItem('smartSchoolToken');
  if(!token)return toast('Your session has expired. Please log in again.');
  const popup=download?null:window.open('about:blank','_blank');
  try{
    const u=src+(src.includes('?')?'&':'?')+'inline='+(download?'0':'1');
    const r=await fetch(u,{headers:{Authorization:'Bearer '+token}});
    if(!r.ok)throw new Error('Unable to access file ('+r.status+')');
    const blob=await r.blob(),url=URL.createObjectURL(blob);
    if(download){const a=document.createElement('a');a.href=url;a.download=filename||'file';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
    else if(popup){popup.location.href=url;setTimeout(()=>URL.revokeObjectURL(url),60000);}
    else window.open(url,'_blank','noopener');
  }catch(err){if(popup)popup.close();toast(err.message||'Unable to open file');}
}

/* Make every existing private-file <a> work without changing the rest of the UI. */
document.addEventListener('click',function(e){
  const a=e.target.closest('a[href^="/api/files/"]');
  if(!a)return;
  e.preventDefault();
  ssOpenFile(a.getAttribute('href'),false,a.getAttribute('download')||'file');
});

}
