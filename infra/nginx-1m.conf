resolver 127.0.0.11 valid=5s ipv6=off;
upstream smart_school_api { zone smart_school_api 64k; server app:5000 resolve; keepalive 128; }
server {
  listen 80;
  server_name _;
  client_max_body_size 10m;
  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;
  location = /api/health { proxy_pass http://smart_school_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location = /api/ready { proxy_pass http://smart_school_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /api/ { proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 60s; proxy_send_timeout 60s; proxy_pass http://smart_school_api; }
  location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; add_header Cache-Control "public, max-age=60"; }
  location /uploads/ { proxy_pass http://smart_school_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
