services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartschool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartschool}
      POSTGRES_DB: ${POSTGRES_DB:-smartschool}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - smartschool_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartschool} -d ${POSTGRES_DB:-smartschool}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smartschool_pgdata:
