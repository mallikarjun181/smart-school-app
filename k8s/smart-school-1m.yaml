apiVersion: v1
kind: Namespace
metadata:
  name: smart-school
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-school-api
  namespace: smart-school
spec:
  replicas: 8
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 2
  selector:
    matchLabels: {app: smart-school-api}
  template:
    metadata:
      labels: {app: smart-school-api}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: YOUR_REGISTRY/smart-school-api:VERSION
          ports: [{containerPort: 5000}]
          envFrom:
            - secretRef: {name: smart-school-secrets}
          env:
            - {name: NODE_ENV, value: production}
            - {name: PORT, value: "5000"}
            - {name: TRUST_PROXY, value: "true"}
            - {name: DATABASE_POOL_SIZE, value: "10"}
            - {name: DATABASE_POOL_TIMEOUT, value: "20"}
          resources:
            requests: {cpu: "500m", memory: "512Mi"}
            limits: {cpu: "2", memory: "2Gi"}
          readinessProbe:
            httpGet: {path: /api/ready, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /api/health, port: 5000}
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec: {command: ["/bin/sh", "-c", "sleep 5"]}
---
apiVersion: v1
kind: Service
metadata:
  name: smart-school-api
  namespace: smart-school
spec:
  selector: {app: smart-school-api}
  ports: [{port: 5000, targetPort: 5000}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: smart-school-api
  namespace: smart-school
spec:
  minAvailable: 6
  selector: {matchLabels: {app: smart-school-api}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smart-school-api
  namespace: smart-school
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smart-school-api
  minReplicas: 8
  maxReplicas: 40
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - {type: Percent, value: 100, periodSeconds: 60}
        - {type: Pods, value: 8, periodSeconds: 60}
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - {type: Percent, value: 25, periodSeconds: 60}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
    - type: Resource
      resource: {name: memory, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: policy/v1
kind: NetworkPolicy
metadata:
  name: smart-school-api
  namespace: smart-school
spec:
  podSelector: {matchLabels: {app: smart-school-api}}
  policyTypes: [Ingress]
  ingress:
    - from: []
      ports: [{protocol: TCP, port: 5000}]
